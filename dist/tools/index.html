<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定ページ</title>
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">

  <div class="min-h-screen w-[48rem] relative">
    <!-- サイドバー -->
    <aside class="w-64 bg-white shadow-md fixed top-0 left-0 h-screen overflow-y-auto z-10">
      <div class="p-6 text-2xl font-bold border-b">
        jRoToolsPlus
      </div>
      <nav class="mt-4">
        <ul>
          <li class="hover:bg-gray-100 border-l-4 border-white js-menu-money">
            <a href="#money" class="flex items-center px-6 py-3 text-gray-700">
              <span class="inline-block w-6 text-center">
                <i class="fa-solid fa-money-check-dollar"></i>
              </span>
              <span class="ml-2">所持Zeny</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- 所持Zenyコンテンツ -->
    <main id="money" class="ml-64 flex-1 p-8 js-pages-money hidden break-words">
      <h1 class="text-2xl font-bold mb-6">所持Zeny</h1>
      <div class="bg-white shadow rounded-lg p-6">
        <p class="mb-4 text-sm text-gray-600">
          所持Zenyを「キャラクター情報ページ」から収集します
        </p>
        <button id="zeny-crawl-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-4">
          取得開始
        </button>
        <span id="zeny-crawl-last-updated" class="text-xs text-gray-500 ml-2"></span>
        <div id="zeny-crawl-status" class="text-sm text-gray-600 mb-2"></div>
        <!-- Zeny表示形式選択ラジオボタン -->
        <div class="mb-4 text-sm">
          <span class="mr-2 text-gray-700">表示形式:</span>
          <label class="mr-3 cursor-pointer">
            <input type="radio" name="zenyDisplayMode" value="short" class="mr-1 align-middle" checked> 省略 (G/M/K)
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="zenyDisplayMode" value="full" class="mr-1 align-middle"> 全桁表示
          </label>
        </div>
        <pre id="zeny-crawl-results-output" class="bg-gray-100 p-4 rounded text-sm overflow-x-auto"></pre>
      </div>
    </main>

  </div>

  <script src="./js/jro-tools-settings.js"></script>
  <script src="./js/zeny-characterpage-scraper.js"></script>
</body>

</html>
