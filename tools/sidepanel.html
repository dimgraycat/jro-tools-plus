<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jRo Tools Plus</title>
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="min-h-screen min-w-80">
    <header class="sticky top-0 z-10 bg-white border-b px-4 py-2">
      <nav>
        <ul class="grid grid-cols-2 gap-2 text-sm">
          <li class="js-menu-money border-b-2 border-transparent rounded">
            <a href="#money" class="flex items-center justify-center gap-2 px-3 py-2 text-gray-700">
              <i class="fa-solid fa-money-check-dollar" aria-hidden="true"></i>
              <span>所持Zeny</span>
            </a>
          </li>
          <li class="js-menu-options border-b-2 border-transparent rounded">
            <a href="#options" class="flex items-center justify-center gap-2 px-3 py-2 text-gray-700">
              <i class="fa-solid fa-gear" aria-hidden="true"></i>
              <span>オプション</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="money" class="p-4 js-pages-money hidden break-words">
      <div class="mb-4">
        <h2 class="text-xl font-bold">所持Zeny</h2>
        <p class="mt-2 text-sm text-gray-600">
          所持Zenyを「キャラクター情報ページ」から収集します
        </p>
      </div>

      <section class="bg-white shadow rounded-lg p-4">
        <div class="flex flex-wrap items-center gap-2 mb-4">
          <button id="zeny-crawl-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            取得開始
          </button>
          <span id="zeny-crawl-last-updated" class="text-xs text-gray-500"></span>
        </div>

        <div id="zeny-crawl-status" class="text-sm text-gray-600 mb-3"></div>

        <div class="mb-4 text-sm space-y-2">
          <span class="block text-gray-700">表示形式:</span>
          <label class="inline-flex items-center mr-3 cursor-pointer">
            <input type="radio" name="zenyDisplayMode" value="short" class="mr-1 align-middle" checked> 省略 (G/M/K)
          </label>
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="zenyDisplayMode" value="full" class="mr-1 align-middle"> 全桁表示
          </label>
        </div>

        <pre id="zeny-crawl-results-output" class="bg-gray-100 p-3 rounded text-sm overflow-x-auto whitespace-pre-wrap"></pre>
      </section>
    </main>

    <main id="options" class="p-4 js-pages-options hidden break-words">
      <div class="mb-4">
        <h2 class="text-xl font-bold">オプション</h2>
      </div>

      <section class="bg-white shadow rounded-lg p-4">
        <h3 class="text-lg font-semibold mb-3">機能設定</h3>

        <div class="space-y-4">
          <div class="flex items-center justify-between gap-4">
            <div class="min-w-0">
              <h4 class="text-base font-medium">公式ページのアイテム名リンク化</h4>
              <p class="mt-1 text-sm text-gray-500">公式ページ内のアイテム名をRO公式ツールのアイテム詳細へリンクします。</p>
            </div>
            <label for="itemNameLinkerEnabled" class="flex shrink-0 items-center cursor-pointer">
              <div class="relative">
                <input type="checkbox" id="itemNameLinkerEnabled" class="sr-only peer" data-storage-toggle data-default-checked="true" checked>
                <div class="w-10 h-4 bg-gray-300 rounded-full shadow-inner peer-checked:bg-green-500"></div>
                <div class="dot absolute w-6 h-6 bg-white rounded-full shadow -left-1 -top-1 transition-all duration-200 ease-in-out peer-checked:translate-x-full peer-checked:bg-green-100"></div>
              </div>
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/jro-tools-settings.js"></script>
  <script src="./js/zeny-characterpage-scraper.js"></script>
</body>
</html>
